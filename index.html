<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Scale Master - Quiz Musicale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1e 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .header {
            background: rgba(5, 5, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            border-bottom: 2px solid rgba(232, 65, 24, 0.5);
        }

        .header h1 {
            font-size: 24px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .difficulty-selector {
            display: flex;
            gap: 8px;
        }

        .difficulty-btn, .restart-btn {
            padding: 8px 16px;
            border: 2px solid #e84118;
            background: rgba(10, 10, 15, 0.8);
            color: #fff;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .difficulty-btn.active, .restart-btn:active {
            background: #e84118;
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(232, 65, 24, 0.5);
        }

        .restart-btn {
            background: rgba(10, 10, 15, 0.8);
            border-color: #4caf50;
        }

        .restart-btn:hover {
            background: rgba(76, 175, 80, 0.3);
        }

        .score-info {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            gap: 20px;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .score-item.correct {
            color: #4caf50;
        }

        .score-item.wrong {
            color: #ff5252;
        }

        .score-item.moves {
            color: #ffd700;
        }

        .scales-area {
            flex: 1;
            padding: 20px 10px;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .scale-column {
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(232, 65, 24, 0.3);
            border-radius: 15px;
            padding: 15px 10px;
            flex: 1;
            max-width: 120px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .scale-title {
            text-align: center;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            font-size: 16px;
            padding: 8px;
            background: linear-gradient(135deg, #e84118, #c23616);
            border-radius: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 2px 10px rgba(232, 65, 24, 0.3);
        }

        .degree-slot {
            background: rgba(5, 5, 10, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin: 8px 0;
            padding: 12px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s;
        }

        .degree-slot.hover-neutral {
            background: rgba(30, 30, 40, 0.7);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .degree-slot.drop-success {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4caf50;
            animation: successPulse 0.5s;
        }

        .degree-slot.drop-error {
            background: rgba(255, 82, 82, 0.3);
            border-color: #ff5252;
            animation: errorShake 0.5s;
        }

        @keyframes successPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .degree-label {
            position: absolute;
            top: 2px;
            left: 8px;
            font-size: 10px;
            color: #ffd700;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .note-in-slot {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .deck-area {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px;
            border-top: 2px solid rgba(232, 65, 24, 0.3);
        }

        .card-deck {
            width: 90px;
            height: 120px;
            background: linear-gradient(135deg, #1a1a2e, #0a0a0f);
            border: 2px solid #ffd700;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.7),
                inset 0 2px 5px rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .card-deck::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
        }

        .card-deck:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.6),
                0 0 20px rgba(255, 215, 0, 0.3);
        }

        .card-deck:active {
            transform: scale(0.95);
        }

        .card-back {
            color: #ffd700;
            font-size: 48px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .current-note {
            background: linear-gradient(135deg, #2c2c3e, #1a1a2e);
            color: #ffd700;
            border: 3px solid #ffd700;
            border-radius: 12px;
            padding: 25px 35px;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.6),
                0 0 20px rgba(255, 215, 0, 0.3);
            cursor: move;
            touch-action: none;
            transition: transform 0.2s;
            position: relative;
        }

        .current-note::before {
            content: '♪';
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 20px;
            color: rgba(255, 215, 0, 0.3);
        }

        .current-note.dragging {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
            border: 2px solid #ffd700;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            text-align: center;
            display: none;
            z-index: 2000;
            color: white;
        }

        .win-message.show {
            display: block;
            animation: popIn 0.5s ease;
        }

        .win-message h2 {
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .win-stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 15px;
        }

        .stat-box {
            background: rgba(10, 10, 15, 0.5);
            padding: 10px;
            border-radius: 10px;
            min-width: 80px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4caf50;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .play-again-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #e84118, #c23616);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(232, 65, 24, 0.4);
            transition: all 0.3s;
        }

        .play-again-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(232, 65, 24, 0.6);
        }

        @media (max-width: 400px) {
            .scale-column {
                max-width: 100px;
            }
            .scale-title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="header">
        <h1>🎵 Scale Master</h1>
        <div class="controls-row">
            <div class="difficulty-selector">
                <button class="difficulty-btn active" data-level="facile">Facile</button>
                <button class="difficulty-btn" data-level="medio">Medio</button>
                <button class="difficulty-btn" data-level="difficile">Difficile</button>
            </div>
            <button class="restart-btn" onclick="initGame()">🔄 Ricomincia</button>
        </div>
    </div>

    <div class="score-info">
        <div class="score-item correct">✓ <span id="correct">0</span></div>
        <div class="score-item wrong">✗ <span id="wrong">0</span></div>
        <div class="score-item moves">↻ <span id="moves">0</span></div>
        <div class="score-item">🎯 <span id="completed">0</span>/<span id="total">21</span></div>
    </div>

    <div class="scales-area" id="scalesArea"></div>

    <div class="deck-area">
        <div id="cardDeck" class="card-deck">
            <span class="card-back">♪</span>
        </div>
    </div>

    <div class="win-message" id="winMessage">
        <h2>🎉 Complimenti!</h2>
        <p>Hai completato tutte le scale!</p>
        <div class="win-stats">
            <div class="stat-box">
                <div class="stat-label">Corrette</div>
                <div class="stat-value" id="finalCorrect">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Errori</div>
                <div class="stat-value" id="finalWrong" style="color: #ff5252">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Mosse</div>
                <div class="stat-value" id="finalMoves" style="color: #ffd700">0</div>
            </div>
        </div>
        <button class="play-again-btn" onclick="initGame()">Gioca Ancora</button>
    </div>

    <script>
        // Crea stelle animate nello sfondo
        function createStars() {
            const starsContainer = document.querySelector('.stars');
            starsContainer.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Definizione delle scale maggiori
        const scalePatterns = {
            'C': ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'G': ['G', 'A', 'B', 'C', 'D', 'E', 'F♯'],
            'D': ['D', 'E', 'F♯', 'G', 'A', 'B', 'C♯'],
            'A': ['A', 'B', 'C♯', 'D', 'E', 'F♯', 'G♯'],
            'E': ['E', 'F♯', 'G♯', 'A', 'B', 'C♯', 'D♯'],
            'B': ['B', 'C♯', 'D♯', 'E', 'F♯', 'G♯', 'A♯'],
            'F♯': ['F♯', 'G♯', 'A♯', 'B', 'C♯', 'D♯', 'E♯'],
            'F': ['F', 'G', 'A', 'B♭', 'C', 'D', 'E'],
            'B♭': ['B♭', 'C', 'D', 'E♭', 'F', 'G', 'A'],
            'E♭': ['E♭', 'F', 'G', 'A♭', 'B♭', 'C', 'D'],
            'A♭': ['A♭', 'B♭', 'C', 'D♭', 'E♭', 'F', 'G'],
            'D♭': ['D♭', 'E♭', 'F', 'G♭', 'A♭', 'B♭', 'C'],
            'G♭': ['G♭', 'A♭', 'B♭', 'C♭', 'D♭', 'E♭', 'F']
        };

        const degreeNames = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

        let gameState = {
            difficulty: 'facile',
            scales: [],
            remainingNotes: [],
            currentNote: null,
            moves: 0,
            completed: 0,
            correct: 0,
            wrong: 0
        };

        function getNumberOfScales() {
            switch(gameState.difficulty) {
                case 'facile': return 3;
                case 'medio': return 4;
                case 'difficile': return 5;
                default: return 3;
            }
        }

        function selectRandomScales() {
            const allScales = Object.keys(scalePatterns);
            const numScales = getNumberOfScales();
            const selected = [];
            
            while(selected.length < numScales) {
                const scale = allScales[Math.floor(Math.random() * allScales.length)];
                if (!selected.includes(scale)) {
                    selected.push(scale);
                }
            }
            
            return selected;
        }

        function initGame() {
            const selectedScales = selectRandomScales();
            gameState.scales = selectedScales.map(key => ({
                key: key,
                notes: scalePatterns[key],
                filled: Array(7).fill(null)
            }));
            
            // Crea array con tutte le note da pescare
            gameState.remainingNotes = [];
            gameState.scales.forEach(scale => {
                scale.notes.forEach((note, index) => {
                    gameState.remainingNotes.push({
                        note: note,
                        scaleKey: scale.key,
                        degree: index
                    });
                });
            });
            
            // Mescola le note
            gameState.remainingNotes.sort(() => Math.random() - 0.5);
            
            gameState.moves = 0;
            gameState.completed = 0;
            gameState.correct = 0;
            gameState.wrong = 0;
            gameState.currentNote = null;
            
            document.getElementById('moves').textContent = '0';
            document.getElementById('completed').textContent = '0';
            document.getElementById('correct').textContent = '0';
            document.getElementById('wrong').textContent = '0';
            document.getElementById('total').textContent = gameState.scales.length * 7;
            document.getElementById('winMessage').classList.remove('show');
            
            renderScales();
            resetDeck();
            createStars();
        }

        function renderScales() {
            const container = document.getElementById('scalesArea');
            container.innerHTML = '';
            
            gameState.scales.forEach((scale, scaleIndex) => {
                const column = document.createElement('div');
                column.className = 'scale-column';
                
                const title = document.createElement('div');
                title.className = 'scale-title';
                title.textContent = scale.key + ' Maggiore';
                column.appendChild(title);
                
                degreeNames.forEach((degree, degreeIndex) => {
                    const slot = document.createElement('div');
                    slot.className = 'degree-slot';
                    slot.dataset.scale = scaleIndex;
                    slot.dataset.degree = degreeIndex;
                    
                    const label = document.createElement('div');
                    label.className = 'degree-label';
                    label.textContent = degree;
                    slot.appendChild(label);
                    
                    if (scale.filled[degreeIndex]) {
                        const noteEl = document.createElement('div');
                        noteEl.className = 'note-in-slot';
                        noteEl.textContent = scale.filled[degreeIndex];
                        slot.appendChild(noteEl);
                    }
                    
                    // Event listeners per drag and drop
                    slot.addEventListener('dragover', handleDragOver);
                    slot.addEventListener('drop', handleDrop);
                    slot.addEventListener('dragleave', handleDragLeave);
                    
                    // Touch events per iOS
                    slot.addEventListener('touchmove', handleTouchMove);
                    slot.addEventListener('touchend', handleTouchEnd);
                    
                    column.appendChild(slot);
                });
                
                container.appendChild(column);
            });
        }

        function resetDeck() {
            const deck = document.getElementById('cardDeck');
            deck.innerHTML = '<span class="card-back">♪</span>';
            deck.className = 'card-deck';
            deck.onclick = drawCard;
        }

        function drawCard() {
            if (gameState.remainingNotes.length === 0) return;
            
            const noteData = gameState.remainingNotes.pop();
            gameState.currentNote = noteData;
            
            const deck = document.getElementById('cardDeck');
            deck.innerHTML = `<div class="current-note" draggable="true" id="currentNote">${noteData.note}</div>`;
            deck.onclick = null;
            
            const noteEl = document.getElementById('currentNote');
            
            // Desktop drag events
            noteEl.addEventListener('dragstart', handleDragStart);
            noteEl.addEventListener('dragend', handleDragEnd);
            
            // Touch events per iOS
            noteEl.addEventListener('touchstart', handleTouchStart);
            noteEl.addEventListener('touchmove', handleTouchMove);
            noteEl.addEventListener('touchend', handleTouchEnd);
        }

        // Drag and Drop handlers
        let draggedElement = null;
        let touchOffset = { x: 0, y: 0 };
        let currentHoveredSlot = null;

        function handleDragStart(e) {
            draggedElement = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.degree-slot').forEach(slot => {
                slot.classList.remove('hover-neutral');
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            if (!gameState.currentNote) return;
            
            const slot = e.currentTarget;
            // Non mostra se è valido o no, solo che è sopra uno slot
            slot.classList.add('hover-neutral');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('hover-neutral');
        }

        function handleDrop(e) {
            e.preventDefault();
            const slot = e.currentTarget;
            slot.classList.remove('hover-neutral');
            
            const scaleIndex = parseInt(slot.dataset.scale);
            const degreeIndex = parseInt(slot.dataset.degree);
            
            placeNote(scaleIndex, degreeIndex);
        }

        // Touch handlers per iOS
        function handleTouchStart(e) {
            const touch = e.touches[0];
            draggedElement = e.target;
            
            const rect = draggedElement.getBoundingClientRect();
            touchOffset.x = touch.clientX - rect.left;
            touchOffset.y = touch.clientY - rect.top;
            
            draggedElement.classList.add('dragging');
            draggedElement.style.position = 'fixed';
            draggedElement.style.zIndex = '1000';
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!draggedElement) return;
            
            const touch = e.touches[0];
            draggedElement.style.left = (touch.clientX - touchOffset.x) + 'px';
            draggedElement.style.top = (touch.clientY - touchOffset.y) + 'px';
            
            // Trova lo slot sotto il dito
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            
            // Rimuovi hover da slot precedente
            if (currentHoveredSlot && currentHoveredSlot !== elementBelow) {
                currentHoveredSlot.classList.remove('hover-neutral');
            }
            
            // Aggiungi hover neutro (non rivela se è giusto o sbagliato)
            if (elementBelow && elementBelow.classList.contains('degree-slot')) {
                elementBelow.classList.add('hover-neutral');
                currentHoveredSlot = elementBelow;
            }
        }

        function handleTouchEnd(e) {
            if (!draggedElement) return;
            
            const touch = e.changedTouches[0];
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            
            // Rimuovi tutti gli hover
            document.querySelectorAll('.degree-slot').forEach(slot => {
                slot.classList.remove('hover-neutral');
            });
            
            if (elementBelow && elementBelow.classList.contains('degree-slot')) {
                const scaleIndex = parseInt(elementBelow.dataset.scale);
                const degreeIndex = parseInt(elementBelow.dataset.degree);
                
                placeNote(scaleIndex, degreeIndex);
            }
            
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement.style.position = '';
                draggedElement.style.zIndex = '';
                draggedElement = null;
            }
            
            currentHoveredSlot = null;
        }

        function isValidPlacement(scaleIndex, degreeIndex) {
            if (!gameState.currentNote) return false;
            
            const scale = gameState.scales[scaleIndex];
            if (scale.filled[degreeIndex]) return false;
            
            const expectedNote = scale.notes[degreeIndex];
            return expectedNote === gameState.currentNote.note;
        }

        function placeNote(scaleIndex, degreeIndex) {
            const scale = gameState.scales[scaleIndex];
            
            // Se lo slot è già occupato, non fare nulla
            if (scale.filled[degreeIndex]) {
                return false;
            }
            
            gameState.moves++;
            document.getElementById('moves').textContent = gameState.moves;
            
            const slot = document.querySelector(`[data-scale="${scaleIndex}"][data-degree="${degreeIndex}"]`);
            
            if (isValidPlacement(scaleIndex, degreeIndex)) {
                // Posizionamento corretto
                scale.filled[degreeIndex] = gameState.currentNote.note;
                gameState.completed++;
                gameState.correct++;
                
                slot.classList.add('drop-success');
                setTimeout(() => slot.classList.remove('drop-success'), 500);
                
                document.getElementById('completed').textContent = gameState.completed;
                document.getElementById('correct').textContent = gameState.correct;
                
                gameState.currentNote = null;
                
                setTimeout(() => {
                    renderScales();
                    resetDeck();
                    
                    // Controlla vittoria
                    if (gameState.completed === gameState.scales.length * 7) {
                        showWinMessage();
                    }
                }, 500);
                
                return true;
            } else {
                // Posizionamento errato
                gameState.wrong++;
                document.getElementById('wrong').textContent = gameState.wrong;
                
                slot.classList.add('drop-error');
                setTimeout(() => slot.classList.remove('drop-error'), 500);
                
                // La carta resta disponibile per essere riposizionata
                return false;
            }
        }

        function showWinMessage() {
            document.getElementById('finalCorrect').textContent = gameState.correct;
            document.getElementById('finalWrong').textContent = gameState.wrong;
            document.getElementById('finalMoves').textContent = gameState.moves;
            document.getElementById('winMessage').classList.add('show');
        }

        // Gestione difficoltà
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                gameState.difficulty = this.dataset.level;
                initGame();
            });
        });

        // Inizializza il gioco
        initGame();

        // Service Worker per PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
