<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sfondo gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Sfondo principale -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- Nota musicale centrale -->
  <g transform="translate(256, 256)">
    <!-- Gambo della nota -->
    <rect x="40" y="-120" width="12" height="180" fill="white" rx="2"/>
    
    <!-- Testa della nota -->
    <ellipse cx="0" cy="40" rx="50" ry="38" fill="white" transform="rotate(-20 0 40)"/>
    
    <!-- Coda della nota -->
    <path d="M 52 -120 Q 90 -100 85 -60 Q 80 -40 52 -30" 
          fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Linee del pentagramma stilizzate -->
  <g opacity="0.3">
    <rect x="80" y="160" width="352" height="4" fill="white"/>
    <rect x="80" y="200" width="352" height="4" fill="white"/>
    <rect x="80" y="240" width="352" height="4" fill="white"/>
    <rect x="80" y="280" width="352" height="4" fill="white"/>
    <rect x="80" y="320" width="352" height="4" fill="white"/>
  </g>
  
  <!-- Stelle decorative -->
  <g fill="white" opacity="0.6">
    <circle cx="100" cy="100" r="8"/>
    <circle cx="412" cy="100" r="6"/>
    <circle cx="100" cy="412" r="6"/>
    <circle cx="412" cy="412" r="8"/>
  </g>
</svg>